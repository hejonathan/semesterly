<div id="selfhost-notice" role="dialog" aria-modal="true" aria-labelledby="selfhost-notice-title"
  style="display:none;position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:16px;">
  <div style="background:#fff;color:#222;max-width:420px;width:100%;border-radius:10px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-family:inherit;">
    <h2 id="selfhost-notice-title" style="margin:0 0 12px;font-size:20px;">Heads up</h2>
    <p style="margin:0 0 10px;line-height:1.5;">This is a student self-hosted version that I created to help with my own schedule. It is not the official Semester.ly site.</p>
    <p style="margin:0 0 10px;line-height:1.5;"><strong>The JHU login does not work.</strong></p>
    <p style="margin:0 0 18px;line-height:1.5;">Use at your own discretion.</p>
    <button type="button" id="selfhost-notice-ok"
      style="width:100%;padding:10px;border:0;border-radius:6px;background:#2a6fdb;color:#fff;font-size:15px;cursor:pointer;">Got it</button>
  </div>
</div>
<script>
  (function () {
    var KEY = "selfhost-notice-dismissed";
    var el = document.getElementById("selfhost-notice");
    try { if (localStorage.getItem(KEY)) return; } catch (e) {}
    el.style.display = "flex";
    document.getElementById("selfhost-notice-ok").onclick = function () {
      el.style.display = "none";
      try { localStorage.setItem(KEY, "1"); } catch (e) {}
    };
  })();
</script>
